# GPU overlay for a 4 GB card (the RTX 2050 on this workstation). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-4gb.yml up -d
#
# All three models in fp16 need ~3885 MiB (3285 weights + ~300 CUDA context +
# ~300 activations). The card has 4096 MiB total and the desktop session holds
# ~550-870 MiB of it, so all three do not fit -- the weights alone exceed the
# free pool. Two on the card is ~2804 MiB, leaving ~420 MiB of headroom.
#
# bge_m3 is the one left on CPU: it carries the 8k context, so its activations
# grow fastest on long inputs, and it is the Bangla-strongest of the three, so
# CPU fp32 keeps its precision rather than the two you would rather quantise.
# It costs ~2.1 GB of host RAM there, and stays fp32 whatever ECVDB_DTYPE says
# because x86 has no native fp16 compute path.
services:
  api:
    environment:
      ECVDB_DEVICE: cuda
      ECVDB_DTYPE: float16
      ECVDB_DEVICE_OVERRIDES: '{"bge_m3":"cpu"}'
      ECVDB_EMBED_BATCH_SIZE: 32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
