services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ec-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image is distroless-ish; /proc/net/tcp is the dependency-free way
      # to assert the port is bound. 18BD is 6333 in hex.
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ec-vectordb-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      # CPU by default so the stack boots anywhere. Switch to GPU with the
      # overlay: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
      DEVICE: ${DEVICE:-cpu}
      EAGER_LOAD_MODELS: "true"
      LOG_FILE: /srv/logs/ec-vectordb.log
    volumes:
      - models:/models          # HF weight cache, survives rebuilds
      - ./data:/srv/data:ro     # question_tag.csv
      # Bind-mounted so the log outlives the container. It is capped at 10 MiB
      # by the handler, so this cannot grow unbounded on the host either.
      - ./logs:/srv/logs

volumes:
  qdrant_storage:
  models:
