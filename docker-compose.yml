services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ec-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ec-vectordb-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      DEVICE: ${DEVICE:-cuda}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
      EAGER_LOAD_MODELS: "true"
      LOG_FILE: /srv/logs/ec-vectordb.log
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - models:/models
      - ./data:/srv/data
      - ./logs:/srv/logs

volumes:
  qdrant_storage:
  models:
