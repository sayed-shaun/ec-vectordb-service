<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Console</title>
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e4e0d9;
  --accent:#3f6b5c; --ok:#2f6f4f; --warn:#8a5a1f; --bad:#8c3a32;
  --okbg:#e8f3ec; --warnbg:#fbf1e2; --badbg:#fbeae8; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){:root{}}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181a; --panel:#1f2124; --ink:#e9e7e3; --muted:#9a968f; --line:#31343a;
  --accent:#7fb7a2; --ok:#8fcfa9; --warn:#e0b070; --bad:#e28b80;
  --okbg:#1c2b23; --warnbg:#2d2418; --badbg:#2e1e1c;
}}
:root[data-theme="dark"]{
  --bg:#17181a; --panel:#1f2124; --ink:#e9e7e3; --muted:#9a968f; --line:#31343a;
  --accent:#7fb7a2; --ok:#8fcfa9; --warn:#e0b070; --bad:#e28b80;
  --okbg:#1c2b23; --warnbg:#2d2418; --badbg:#2e1e1c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
header{padding:18px 16px 12px;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.bar label{display:flex;gap:6px;align-items:center}
.bar input[type=number]{width:72px}
input,button,select{font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:transparent;font-weight:500}
button.ghost{background:var(--panel);color:var(--muted);font-weight:400}
button:disabled{opacity:.5;cursor:default}
#log{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.turn{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
.q{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:500}
.q .n{color:var(--muted);font-weight:400;font-size:12px;margin-right:8px;font-family:var(--mono)}
.a{padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.chip{font-family:var(--mono);font-size:11.5px;padding:2.5px 7px;border-radius:5px;
  background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip b{font-weight:600;color:var(--ink)}
.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1px solid var(--line);padding:12px 16px}
.composer .inner{max-width:900px;margin:0 auto;display:flex;gap:8px}
.composer input{flex:1}
.empty{color:var(--muted);padding:28px 2px;font-size:14px}
.empty code{font-family:var(--mono);font-size:12.5px}
.err{border-color:var(--bad)}
.err .a{color:var(--bad)}
@media (max-width:560px){.bar{gap:10px}.wrap{padding:0 16px 110px}}
</style>
</head>
<body>
<header>
  <h1>QA Console</h1>
  <span class="sub">POST /qa &middot; history threaded client-side</span>
  <span style="flex:1"></span>
  <button class="ghost" id="theme" title="Toggle theme">&#9682;</button>
</header>

<div class="wrap">
  <div class="bar">
    <label>min_cosine <input type="number" id="cos" step="0.01" min="0" max="1" placeholder="0.78"></label>
    <label>agreement <input type="number" id="agree" min="1" max="3" placeholder="2"></label>
    <label>top_k <input type="number" id="topk" min="1" max="100" placeholder="10"></label>
    <label><input type="checkbox" id="usehist" checked> send history</label>
    <span style="flex:1"></span>
    <button class="ghost" id="reset">New conversation</button>
  </div>

  <div id="log">
    <div class="empty">
      Ask something. Then try a bare follow-up &mdash; <code>&#2475;&#2495; &#2453;&#2468;?</code> &mdash;
      with <b>send history</b> on and off, and compare the tag.
    </div>
  </div>
</div>

<form class="composer" id="form">
  <div class="inner">
    <input id="q" autocomplete="off" placeholder="Ask a question…" autofocus>
    <button id="send">Ask</button>
  </div>
</form>

<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let history = [];

const theme = $('#theme');
try { if (localStorage.getItem('qa-theme')) document.documentElement.dataset.theme = localStorage.getItem('qa-theme'); } catch (e) {}
theme.onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('qa-theme', next); } catch (e) {}
};

$('#reset').onclick = () => { history = []; log.innerHTML = ''; $('#q').focus(); };

const num = el => el.value === '' ? null : Number(el.value);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function chip(label, value, cls) {
  return `<span class="chip ${cls || ''}">${esc(label)} <b>${esc(value)}</b></span>`;
}

function render(question, data, error) {
  const el = document.createElement('div');
  el.className = 'turn' + (error ? ' err' : '');
  const n = history.length || (log.querySelectorAll('.turn').length + 1);

  if (error) {
    el.innerHTML = `<div class="q"><span class="n">${n}</span>${esc(question)}</div>
                    <div class="a">${esc(error)}</div>`;
    log.appendChild(el); return;
  }

  const conf = data.confident;
  const per = Object.entries(data.per_model_tag || {})
    .map(([m, t]) => chip(m, t, t === data.tag ? 'ok' : 'warn')).join('');

  el.innerHTML = `
    <div class="q"><span class="n">${n}</span>${esc(question)}</div>
    <div class="a">${esc(data.answer) || '<em>no answer</em>'}</div>
    <div class="meta">
      ${chip('tag', data.tag, conf ? 'ok' : 'bad')}
      ${chip('confident', conf, conf ? 'ok' : 'bad')}
      ${data.fallback_reason ? chip('reason', data.fallback_reason, 'bad') : ''}
      ${chip('cosine', Number(data.top_cosine).toFixed(3))}
      ${chip('agreement', data.model_agreement + '/3')}
      ${data.used_context ? chip('used_context', 'true', 'warn') : ''}
      ${chip('took', Math.round(data.took_ms) + 'ms')}
      ${per}
      ${data.matched_question ? chip('matched', data.matched_question) : ''}
    </div>`;
  log.appendChild(el);
}

$('#form').onsubmit = async e => {
  e.preventDefault();
  const question = $('#q').value.trim();
  if (!question) return;

  const body = { question };
  if ($('#usehist').checked) body.history = history;
  const c = num($('#cos')), a = num($('#agree')), k = num($('#topk'));
  if (c !== null) body.min_cosine = c;
  if (a !== null) body.min_model_agreement = a;
  if (k !== null) body.top_k = k;

  if (log.querySelector('.empty')) log.innerHTML = '';
  $('#q').value = ''; $('#send').disabled = true;

  try {
    const res = await fetch('/qa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      render(question, null, `HTTP ${res.status}: ${data.detail ? JSON.stringify(data.detail) : ''}`);
    } else {
      if ($('#usehist').checked) history = data.history || [];
      render(question, data);
    }
  } catch (err) {
    render(question, null, String(err));
  } finally {
    $('#send').disabled = false;
    $('#q').focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
};
</script>
</body>
</html>
