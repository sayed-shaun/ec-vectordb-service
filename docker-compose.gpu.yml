# GPU overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Kept separate from the base file because a `devices: [driver: nvidia]`
# reservation makes `up` fail outright on a host without the nvidia container
# runtime -- the base stack has to stay runnable on a plain CPU box.
#
# e5 in fp16 needs ~1068 MiB of weights plus ~300 MiB CUDA context and
# ~300 MiB activations, so ~1.7 GB in total -- a 4 GB card holds it.
services:
  api:
    environment:
      DEVICE: cuda
      EMBED_BATCH_SIZE: 64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
